version: '3.9'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    volumes:
      - ${CONFIG_PATH}:/opt/parser/config.json
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CONFIG_PATH: ${CONFIG_PATH}
    deploy:
      resources:  
        limits:
          cpus: "1.50"
          memory: 2g
        reservations:
          cpus: "0.50"
          memory: 1g

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: parser_user
      POSTGRES_PASSWORD: parser_password
      POSTGRES_DB: parser_db
    volumes:
      - db_data:/var/lib/postgresql/data

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  db_data:
